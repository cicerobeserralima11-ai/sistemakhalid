name: Atualizar controle de jornada das rotas
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/route-schedule.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar módulo de jornada
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          if 'id="jornada-config"' not in s:
              extra='''<section id="jornada-config" class="section"><h2>🕐 Controle da Jornada</h2><div class="form-grid"><div class="field"><label>Início da jornada</label><input id="horaInicio" type="time" value="19:00"></div><div class="field"><label>Retorno obrigatório à base</label><input id="horaLimite" type="time" value="05:00"></div><div class="field"><label>Tempo de inspeção por condomínio</label><input id="tempoVisita" type="number" min="0" value="20"></div></div><p class="small" style="margin-top:10px">O sistema considera deslocamento, tempo de cada inspeção e retorno à base.</p></section>'''
              s=s.replace(marker,extra+marker)
          if 'function avaliarJornadaKhalid' not in s:
              script='''<script>function minutosK(v){let[a,b]=v.split(':').map(Number);return a*60+b}function duracaoK(a,b){let d=b-a;if(d<0)d+=1440;return d}function avaliarJornadaKhalid(rota,totalDeslocamentoSeg,retornoSeg){const hi=document.getElementById('horaInicio')?.value||'19:00',hl=document.getElementById('horaLimite')?.value||'05:00',tv=Number(document.getElementById('tempoVisita')?.value||20),inicio=minutosK(hi),limite=minutosK(hl),direcao=Math.round((totalDeslocamentoSeg+retornoSeg)/60),visitas=rota.length,tempoTotal=direcao+visitas*tv,janela=duracaoK(inicio,limite),cabe=tempoTotal<=janela,chegada=inicio+tempoTotal,previsao=((chegada%1440)+1440)%1440,ph=String(Math.floor(previsao/60)).padStart(2,'0'),pm=String(previsao%60).padStart(2,'0');return{cabe,tempoTotal,janela,chegada:`${ph}:${pm}`,limite:hl,direcao,visitas,tv}}window._avaliarJornadaKhalid=avaliarJornadaKhalid;</script>'''
              s=s.replace(marker,script+marker)
          target="let stops=route.map(x=>x.latitude+','+x.longitude);"
          if 'avaliarJornadaKhalid(route,totalT' not in s and target in s:
              replacement=target+"const retornoPts=[{latitude:-23.5115,longitude:-46.4875},route[route.length-1]]; const retornoUrl='https://router.project-osrm.org/route/v1/driving/'+retornoPts[0].longitude+','+retornoPts[0].latitude+';'+retornoPts[1].longitude+','+retornoPts[1].latitude+'?overview=false'; const retornoData=await (await fetch(retornoUrl)).json(); const retornoSeg=retornoData.routes?.[0]?.duration||0; const jornada=_avaliarJornadaKhalid(route,totalT,retornoSeg);"
              s=s.replace(target,replacement)
              old="<p class=\"small\">Tempo de visita não está incluído no deslocamento. Se usar 20 min por condomínio, acrescente '+formatMin(route.length*20*60)+' ao tempo total.</p>"
              new="<p class=\"small\">Incluindo retorno à base e 20 min por inspeção: <strong>'+formatMin(jornada.tempoTotal*60)+'</strong>. Chegada estimada na base: <strong>'+jornada.chegada+'</strong>. Limite: <strong>'+jornada.limite+'</strong>.</p><div class=\"info\" style=\"margin-top:12px\">'+(jornada.cabe?'✅ <strong>Esta rota cabe na sua jornada.</strong>':'⚠️ <strong>Esta rota ultrapassa o horário de retorno.</strong>')+'</div>'
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Calcular limite da jornada e retorno à base'
          git push
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nova Inspeção - Sistema Khalid</title><style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#1f2937}header{background:#111827;color:#fff;padding:20px}.container{max-width:1100px;margin:auto;padding:20px}.section{background:#fff;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 8px #0001}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{padding:10px;border:1px solid #cbd5e1;border-radius:7px}.btn{display:inline-block;border:0;padding:12px 15px;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;margin:3px;text-decoration:none}.secondary{background:#475569}.ok{background:#dcfce7;color:#166534;padding:14px;border-radius:8px;margin:12px 0}.small{color:#64748b;font-size:13px}.check{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.check label{background:#f8fafc;padding:10px;border-radius:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}@media(max-width:700px){.form-grid,.check{grid-template-columns:1fr}}
</style></head><body><header><div class="container"><h1>🛡️ Sistema Khalid</h1><p>Nova Inspeção Operacional</p></div></header><main class="container">
<div class="section"><a class="btn secondary" href="index.html">⬅️ Voltar ao menu</a><h2>📋 Registrar Nova Inspeção</h2><div class="form-grid"><div class="field"><label>Data *</label><input id="data" type="date"></div><div class="field"><label>Horário</label><input id="hora" type="time"></div><div class="field full"><label>Condomínio *</label><select id="condominio"><option value="">Selecione...</option></select></div><div class="field"><label>Inspetor</label><input id="inspetor" value="Khalid"></div><div class="field"><label>Resultado geral</label><select id="resultado"><option>Conforme</option><option>Conforme com orientação</option><option>Não conforme</option></select></div><div class="field full"><label>Observações</label><textarea id="observacoes" rows="4" placeholder="Descreva a situação encontrada..."></textarea></div></div><h3>Checklist operacional</h3><div class="check"><label><input type="checkbox" id="limpeza"> Limpeza da guarita</label><label><input type="checkbox" id="uniforme"> Uniforme completo</label><label><input type="checkbox" id="postura"> Postura e atendimento</label><label><input type="checkbox" id="radio"> HT / rádio funcionando</label><label><input type="checkbox" id="interfone"> Interfone funcionando</label><label><input type="checkbox" id="telefone"> Telefone funcionando</label><label><input type="checkbox" id="livro"> Livro de ocorrências atualizado</label><label><input type="checkbox" id="portao"> Portões funcionando</label><label><input type="checkbox" id="iluminacao"> Iluminação adequada</label><label><input type="checkbox" id="chaves"> Chaves organizadas</label></div><div style="margin-top:15px"><button class="btn" onclick="salvarInspecao()">💾 Salvar Inspeção</button><button class="btn secondary" onclick="limpar()">↺ Limpar</button></div><div id="msg"></div></div>
<div class="section"><h2>📚 Inspeções registradas</h2><div class="toolbar"><input id="busca" style="padding:10px;flex:1" placeholder="🔎 Buscar..." oninput="renderizar()"><button class="btn secondary" onclick="window.print()">🖨️ Imprimir</button></div><div style="overflow:auto;margin-top:10px"><table class="table"><thead><tr><th>Data</th><th>Horário</th><th>Condomínio</th><th>Inspetor</th><th>Resultado</th><th>Ação</th></tr></thead><tbody id="lista"></tbody></table></div></div>
</main><footer style="text-align:center;padding:25px;color:#64748b">Sistema Khalid © 2026</footer><script>
const KEY='sistemaKhalidInspecoes';const COND='sistemaKhalidCondominios';
function arr(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function conds(){return JSON.parse(localStorage.getItem(COND)||'[]')}
function carregar(){const s=document.getElementById('condominio');s.innerHTML='<option value="">Selecione...</option>'+conds().filter(x=>x.status==='Ativo').map(x=>'<option value="'+esc(x.nome)+'">'+esc(x.nome)+'</option>').join('');const d=new Date();document.getElementById('data').value=d.toISOString().slice(0,10);document.getElementById('hora').value=d.toTimeString().slice(0,5);renderizar()}
function esc(v){return String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function salvarInspecao(){const cond=document.getElementById('condominio').value;if(!cond){alert('Selecione o condomínio.');return}const item={id:Date.now(),data:document.getElementById('data').value,hora:document.getElementById('hora').value,condominio:cond,inspetor:document.getElementById('inspetor').value.trim()||'Khalid',resultado:document.getElementById('resultado').value,observacoes:document.getElementById('observacoes').value,checklist:{limpeza:limpeza.checked,uniforme:uniforme.checked,postura:postura.checked,radio:radio.checked,interfone:interfone.checked,telefone:telefone.checked,livro:livro.checked,portao:portao.checked,iluminacao:iluminacao.checked,chaves:chaves.checked}};const a=arr();a.push(item);localStorage.setItem(KEY,JSON.stringify(a));document.getElementById('msg').innerHTML='<div class="ok">✅ Inspeção registrada com sucesso.</div>';renderizar();}
function limpar(){document.getElementById('condominio').value='';document.getElementById('observacoes').value='';document.querySelectorAll('.check input').forEach(x=>x.checked=false);document.getElementById('resultado').value='Conforme'}
function excluir(id){if(confirm('Excluir esta inspeção?')){localStorage.setItem(KEY,JSON.stringify(arr().filter(x=>x.id!==id)));renderizar()}}
function renderizar(){const q=(document.getElementById('busca')?.value||'').toLowerCase();const a=arr().filter(x=>(x.data+' '+x.hora+' '+x.condominio+' '+x.inspetor+' '+x.resultado).toLowerCase().includes(q));document.getElementById('lista').innerHTML=a.sort((x,y)=>(y.data+y.hora).localeCompare(x.data+x.hora)).map(x=>'<tr><td>'+esc(x.data)+'</td><td>'+esc(x.hora)+'</td><td><strong>'+esc(x.condominio)+'</strong><br><span class="small">'+esc(x.observacoes)+'</span></td><td>'+esc(x.inspetor)+'</td><td>'+esc(x.resultado)+'</td><td><button class="btn" onclick="excluir('+x.id+')">🗑️</button></td></tr>').join('')||'<tr><td colspan="6">Nenhuma inspeção registrada.</td></tr>'}
carregar();
</script><script src="khalid-cloud.js"></script></body></html>

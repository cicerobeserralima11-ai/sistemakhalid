<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro de Ocorrências - Sistema Khalid</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}header{background:#111827;color:#fff;padding:18px}.container{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px #0001;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{font-weight:bold;font-size:14px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:8px;margin-top:5px}textarea{min-height:110px}.btn{border:0;padding:11px 15px;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;margin:5px 3px}.danger{background:#dc2626}.secondary{background:#475569}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.item{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:15px;margin:10px 0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#fee2e2;color:#991b1b;font-size:12px;font-weight:bold}.small{font-size:13px;color:#64748b}.media-box{border:1px solid #cbd5e1;border-radius:10px;padding:14px;background:#f8fafc}.media-actions{display:flex;gap:8px;flex-wrap:wrap}.media-btn{display:inline-flex;align-items:center;gap:7px;padding:11px 14px;border:1px solid #94a3b8;border-radius:8px;background:#fff;color:#1f2937;cursor:pointer;font-weight:bold}.media-btn:hover{background:#e2e8f0}.media-btn input{display:none}.media-preview{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.preview{position:relative;border:1px solid #cbd5e1;border-radius:8px;padding:6px;background:#fff}.preview img,.preview video{width:150px;height:110px;object-fit:cover;border-radius:6px}.remove-media{position:absolute;right:4px;top:4px;border:0;border-radius:50%;background:#dc2626;color:#fff;width:25px;height:25px;cursor:pointer}.evidence{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.evidence img,.evidence video{width:180px;height:130px;object-fit:cover;border-radius:8px;border:1px solid #cbd5e1}.file-link{display:inline-flex;align-items:center;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;text-decoration:none;color:#1f2937}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.media-btn{flex:1;justify-content:center}}
</style></head><body><header><div class="container"><h1>🚨 Registro de Ocorrências</h1><div>Sistema Khalid — Gestão Operacional</div></div></header><main class="container"><div class="card"><h2>Nova ocorrência</h2><div class="grid"><div><label>Data *</label><input id="data" type="date"></div><div><label>Horário *</label><input id="hora" type="time"></div><div><label>Condomínio *</label><input id="condominio" list="condominios" placeholder="Nome do condomínio"><datalist id="condominios"></datalist></div><div><label>Colaborador</label><input id="colaborador" placeholder="Nome do colaborador"></div><div><label>Tipo</label><select id="tipo"><option>Operacional</option><option>Falta de colaborador</option><option>Atestado</option><option>Treinamento</option><option>Postura / conduta</option><option>Equipamento</option><option>Portão / acesso</option><option>Inspeção</option><option>Outro</option></select></div><div><label>Gravidade</label><select id="gravidade"><option>Baixa</option><option>Média</option><option>Alta</option><option>Crítica</option></select></div><div class="full"><label>Descrição da ocorrência *</label><textarea id="descricao" placeholder="Descreva o ocorrido com clareza."></textarea></div><div class="full"><label>Providências adotadas</label><textarea id="providencias" placeholder="Orientação, substituição, contato com síndico, ajuste operacional etc."></textarea></div><div class="full"><label>📷 Evidências da ocorrência</label><div class="media-box"><div class="media-actions"><label class="media-btn">📷 Tirar foto<input id="foto" type="file" accept="image/*" capture="environment" onchange="adicionarMidia(this,'foto')"></label><label class="media-btn">🎥 Filmar<input id="video" type="file" accept="video/*" capture="environment" onchange="adicionarMidia(this,'video')"></label><label class="media-btn">📁 Puxar do arquivo<input id="arquivo" type="file" accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx" multiple onchange="adicionarMidia(this,'arquivo')"></label></div><div class="small" style="margin-top:8px">No celular, “Tirar foto” e “Filmar” usam a câmera. No computador, abrirão o seletor disponível. Limite de 15 MB por arquivo.</div><div id="mediaPreview" class="media-preview"></div></div></div><div class="full"><label>Observações</label><textarea id="observacoes"></textarea></div></div><button class="btn" onclick="salvar()">💾 Salvar ocorrência</button><button class="btn secondary" onclick="limpar()">↺ Limpar</button><a class="btn secondary" href="index.html" style="text-decoration:none;display:inline-block">⬅️ Voltar ao sistema</a></div><div class="card"><h2>📋 Histórico</h2><div class="toolbar"><input id="busca" placeholder="🔎 Buscar por condomínio, colaborador ou ocorrência"><button class="btn secondary" onclick="exportar()">📄 Exportar CSV</button></div><div id="lista"></div></div></main><script>const K='sistemaKhalidOcorrencias',CK='sistemaKhalidCondominios';let midias=[];function dados(){return JSON.parse(localStorage.getItem(K)||'[]')}function salvarDados(a){localStorage.setItem(K,JSON.stringify(a))}function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[c]||c))}function carregarCondominios(){let a=JSON.parse(localStorage.getItem(CK)||'[]');document.getElementById('condominios').innerHTML=a.map(x=>`<option value="${esc(x.nome)}">`).join('')}function adicionarMidia(input,tipo){Array.from(input.files||[]).forEach(file=>{if(file.size>15*1024*1024){alert('Arquivo muito grande: '+file.name+' (limite de 15 MB).');return}const reader=new FileReader();reader.onload=()=>{midias.push({nome:file.name,tipo:file.type||tipo,tamanho:file.size,data:reader.result});renderMidias()};reader.readAsDataURL(file)});input.value=''}function renderMidias(){const el=document.getElementById('mediaPreview');el.innerHTML=midias.length?midias.map((m,i)=>{let visual=m.tipo.startsWith('image/')?`<img src="${m.data}" alt="Foto">`:m.tipo.startsWith('video/')?`<video src="${m.data}" controls></video>`:`<div style="width:150px;height:110px;display:grid;place-items:center;text-align:center">📎<br>${esc(m.nome)}</div>`;return `<div class="preview">${visual}<button type="button" class="remove-media" onclick="removerMidia(${i})">×</button></div>`}).join(''):'<span class="small">Nenhuma evidência adicionada.</span>'}function removerMidia(i){midias.splice(i,1);renderMidias()}function salvar(){let data=document.getElementById('data').value,hora=document.getElementById('hora').value,cond=document.getElementById('condominio').value.trim(),desc=document.getElementById('descricao').value.trim();if(!data||!hora||!cond||!desc){alert('Preencha data, horário, condomínio e descrição.');return}let a=dados();a.unshift({id:Date.now(),data,hora,condominio:cond,colaborador:document.getElementById('colaborador').value.trim(),tipo:document.getElementById('tipo').value,gravidade:document.getElementById('gravidade').value,descricao:desc,providencias:document.getElementById('providencias').value.trim(),observacoes:document.getElementById('observacoes').value.trim(),midias:midias});try{salvarDados(a)}catch(e){alert('Não foi possível salvar as evidências. Tente remover arquivos grandes e salvar novamente.');return}limpar();renderizar();alert('Ocorrência registrada com sucesso!')}function limpar(){['data','hora','condominio','colaborador','descricao','providencias','observacoes'].forEach(id=>document.getElementById(id).value='');midias=[];renderMidias();document.getElementById('data').value=new Date().toISOString().slice(0,10);document.getElementById('hora').value=new Date().toTimeString().slice(0,5)}function excluir(id){if(confirm('Excluir esta ocorrência?')){salvarDados(dados().filter(x=>x.id!==id));renderizar()}}function renderizar(){let q=document.getElementById('busca').value.toLowerCase(),a=dados().filter(x=>(x.condominio+' '+x.colaborador+' '+x.tipo+' '+x.descricao).toLowerCase().includes(q)),el=document.getElementById('lista');el.innerHTML=a.length?'':'<p class="small">Nenhuma ocorrência encontrada.</p>';a.forEach(x=>{let ev=(x.midias||[]).map(m=>m.tipo.startsWith('image/')?`<img src="${m.data}" alt="${esc(m.nome)}">`:m.tipo.startsWith('video/')?`<video src="${m.data}" controls></video>`:`<a class="file-link" download="${esc(m.nome)}" href="${m.data}">📎 ${esc(m.nome)}</a>`).join('');el.innerHTML+=`<div class="item"><b>🚨 ${esc(x.condominio)}</b> <span class="badge">${esc(x.gravidade)}</span><div class="small">${esc(x.data)} às ${esc(x.hora)} · ${esc(x.tipo)} · ${esc(x.colaborador||'Colaborador não informado')}</div><p><b>Descrição:</b> ${esc(x.descricao)}</p><p><b>Providências:</b> ${esc(x.providencias||'Não informado')}</p>${x.observacoes?`<p><b>Observações:</b> ${esc(x.observacoes)}</p>`:''}${ev?`<div class="evidence">${ev}</div>`:''}<button class="btn danger" onclick="excluir(${x.id})">🗑️ Excluir</button></div>`})}function exportar(){let a=dados();if(!a.length){alert('Não há ocorrências para exportar.');return}let rows=[['Data','Hora','Condomínio','Colaborador','Tipo','Gravidade','Descrição','Providências','Observações'],...a.map(x=>[x.data,x.hora,x.condominio,x.colaborador,x.tipo,x.gravidade,x.descricao,x.providencias,x.observacoes])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),aEl=document.createElement('a');aEl.href=u;aEl.download='ocorrencias-sistema-khalid.csv';aEl.click();URL.revokeObjectURL(u)}document.getElementById('busca').addEventListener('input',renderizar);carregarCondominios();limpar();renderizar();</script></body></html>

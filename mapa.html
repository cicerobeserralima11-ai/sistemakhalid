<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa Operacional - Sistema Khalid</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:Arial;background:#f4f6f8;color:#1f2937}header{background:#111827;color:#fff;padding:14px 16px}.bar{background:#fff;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 2px 6px #0002}.bar button,select{border:0;padding:10px 12px;border-radius:7px;background:#2563eb;color:#fff;cursor:pointer}select{background:#fff;color:#111;border:1px solid #cbd5e1}.base{background:#475569!important}#map{height:calc(100vh - 270px);min-height:430px}.panel{background:#fff;padding:12px;max-height:220px;overflow:auto}.status{font-weight:bold;margin:5px 0}.ok{color:#166534}.warn{color:#b91c1c}.rota{display:flex;gap:8px;flex-wrap:wrap}.item{padding:8px 10px;background:#f1f5f9;border-radius:8px;font-size:13px}.item b{display:block}.small{font-size:12px;color:#64748b}.legend{position:absolute;z-index:1000;bottom:20px;right:10px;background:#fff;padding:10px;border-radius:8px;box-shadow:0 2px 8px #0003}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.a{background:#2563eb}.b{background:#16a34a}.c{background:#dc2626}.baseDot{background:#111827}</style></head><body><header><h2 style="margin:0">🗺️ Mapa Operacional — Sistema Khalid</h2><div>Melhor sequência pela distância real das ruas</div></header><div class="bar"><select id="circuito"><option value="A - Norte">A — Norte</option><option value="B - Leste">B — Leste</option><option value="C - Sul">C — Sul</option><option value="TODOS">Todos os 21</option></select><button onclick="calcular()">🚀 Calcular melhor sequência</button><button class="base" onclick="map.setView([base.lat,base.lng],13)">📍 Base</button><span class="small">19:00 → 05:00 · 20 min/inspeção</span></div><div class="panel"><div id="status">Escolha o circuito e clique em “Calcular melhor sequência”.</div><div id="rota" class="rota"></div></div><div id="map"></div><div class="legend"><div><span class="dot a"></span>A — Norte</div><div><span class="dot b"></span>B — Leste</div><div><span class="dot c"></span>C — Sul</div><div><span class="dot baseDot"></span>Base</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const base={nome:'Base Operacional',lat:-23.5115,lng:-46.4875,endereco:'Rua Evaristo Emiliano Bueno, 22 - Ponte Rasa, São Paulo - SP'};const pontos=[['A - Norte',1,'Swiss Garden',-23.4694,-46.6607],['A - Norte',2,'Matriz',-23.4848,-46.7002],['A - Norte',3,'Alameda Freguesia',-23.482,-46.6495],['A - Norte',4,'Barra do Jacaré',-23.5182,-46.5398],['A - Norte',5,'Edifício Casablanca',-23.5003,-46.6347],['A - Norte',6,'Santana At Work',-23.501,-46.634],['B - Leste',1,'Clárico Lispector',-23.4315,-46.5102],['B - Leste',2,'Vita São Miguel',-23.4801,-46.4498],['B - Leste',3,'Mirassol',-23.5502,-46.4795],['B - Leste',4,'Florence',-23.5408,-46.4697],['B - Leste',5,'Comendador José de Lucia',-23.5235,-46.505],['B - Leste',6,'Ravenna Penha',-23.523,-46.5102],['B - Leste',7,'Quatro Estações',-23.5207,-46.4951],['B - Leste',8,'Solar das Hortências',-23.5201,-46.4905],['C - Sul',1,'Saint Moritz',-23.5572,-46.6487],['C - Sul',2,'Angélica',-23.5453,-46.6648],['C - Sul',3,'Boulevard',-23.5305,-46.7045],['C - Sul',4,'Elevê',-23.5301,-46.6998],['C - Sul',5,'Apolo',-23.598,-46.6329],['C - Sul',6,'Spot Alto da Boa Vista',-23.6165,-46.6997],['C - Sul',7,'Green Office',-23.6103,-46.7205]];const map=L.map('map').setView([-23.54,-46.59],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);const markers=[];const baseM=L.circleMarker([base.lat,base.lng],{radius:10,color:'#111827',fillColor:'#111827',fillOpacity:1}).addTo(map).bindPopup('<b>📍 Base Operacional</b><br>'+base.endereco);pontos.forEach(p=>{let col=p[0][0]==='A'?'#2563eb':p[0][0]==='B'?'#16a34a':'#dc2626';let m=L.circleMarker([p[3],p[4]],{radius:8,color:col,fillColor:col,fillOpacity:.85}).addTo(map).bindPopup('<b>'+p[1]+'. '+p[2]+'</b><br>'+p[0]+'<br><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination='+p[3]+','+p[4]+'">📍 Google Maps</a> · <a target="_blank" href="https://www.waze.com/ul?ll='+p[3]+'%2C'+p[4]+'&navigate=yes">🧭 Waze</a>');markers.push(m)});let line=null;async function matriz(coords){let s=coords.map(x=>x[1]+','+x[0]).join(';');let u='https://router.project-osrm.org/table/v1/driving/'+s+'?annotations=duration,distance';let r=await fetch(u);if(!r.ok)throw Error('Serviço de rotas indisponível');return r.json()}function fmtMin(x){let m=Math.round(x/60);return Math.floor(m/60)+'h '+(m%60)+'min'}function hora(min){let h=Math.floor(min/60)%24, m=Math.round(min%60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}async function calcular(){const c=document.getElementById('circuito').value;const pts=c==='TODOS'?pontos:pontos.filter(p=>p[0]===c);const status=document.getElementById('status'),rota=document.getElementById('rota');status.className='status';status.textContent='Calculando distância real pelas ruas...';rota.innerHTML='';if(line)map.removeLayer(line);try{const all=[[base.lng,base.lat],...pts.map(p=>[p[4],p[3]])];const t=await matriz(all);let rest=pts.map((p,i)=>i+1),cur=0,ord=[],totalD=0,totalT=0;while(rest.length){let best=rest[0];for(const j of rest)if(t.distances[cur][j]<t.distances[cur][best])best=j;ord.push(best);totalD+=t.distances[cur][best];totalT+=t.durations[cur][best];cur=best;rest=rest.filter(x=>x!==best)}totalD+=t.distances[cur][0];totalT+=t.durations[cur][0];let inicio=19*60,tempo=inicio,coords=[[base.lat,base.lng]];let html='';ord.forEach((idx,k)=>{const p=pts[idx-1],prev= k===0?0:ord[k-1];const d=t.distances[prev][idx],tt=t.durations[prev][idx];tempo+=tt/60;const chegada=tempo;tempo+=20;coords.push([p[3],p[4]]);html+=`<div class="item"><b>${k+1}. ${p[2]}</b><span class="small">Chegada ${hora(chegada)} · saída ${hora(tempo)} · ${d/1000<1?(d.toFixed(0)+' m'):(d/1000).toFixed(1)+' km'} · ${fmtMin(tt)}</span></div>`});tempo+=t.durations[cur][0]/60;coords.push([base.lat,base.lng]);const ok=tempo<=29*60;status.innerHTML=(ok?'✅ ESTA ROTA CABE NA SUA JORNADA':'⚠️ ESTA ROTA ULTRAPASSA O HORÁRIO DE RETORNO')+'<br><span class="small">'+ord.length+' inspeções · '+(totalD/1000).toFixed(1)+' km reais · '+fmtMin(totalT)+' dirigindo + '+(ord.length*20)+' min de inspeção · retorno previsto '+hora(tempo)+'</span>';status.className='status '+(ok?'ok':'warn');rota.innerHTML=html;line=L.polyline(coords,{weight:5}).addTo(map);map.fitBounds(line.getBounds(),{padding:[25,25]});}catch(e){status.className='status warn';status.textContent='⚠️ Não foi possível calcular agora. Verifique sua conexão e tente novamente.'}}</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa Operacional - Sistema Khalid</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:Arial;background:#f4f6f8;color:#222}header{background:#222;color:#fff;padding:14px 16px}.bar,.panel{background:#fff;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 2px 6px #0002}.bar button,select{border:1px solid #999;padding:10px 12px;border-radius:7px;background:#eee;color:#222;cursor:pointer}.panel{display:block}.status{font-weight:bold;margin-bottom:8px}.ok{color:#222}.warn{color:#8b0000}.rota{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{padding:10px;background:#f5f5f5;border:1px solid #ddd;border-radius:8px}.item b{display:block}.small{font-size:12px;color:#666}.route{background:#ddd!important}.base{background:#ddd!important}#map{height:calc(100vh - 285px);min-height:430px}.legend{position:absolute;z-index:1000;bottom:20px;right:10px;background:#fff;padding:10px;border-radius:8px;box-shadow:0 2px 8px #0003}@media(max-width:800px){.rota{grid-template-columns:1fr}#map{height:55vh}}</style></head><body><header><h2 style="margin:0">🗺️ Mapa Operacional — Sistema Khalid</h2><div>Montagem de rotas com os 19 condomínios cadastrados</div></header><div class="bar"><select id="circuito"><option value="A - Norte">A — Norte</option><option value="B - Leste">B — Leste</option><option value="C - Sul">C — Sul</option><option value="TODOS">Todos os 19</option></select><button onclick="calcular()">🚀 Calcular melhor sequência</button><button class="route" onclick="montarRota()">🗺️ Montar Rota</button><button class="base" onclick="map.setView([base.lat,base.lng],13)">📍 Base</button><span class="small">19:00 → 05:00 · 20 min/inspeção</span></div><div class="panel"><div id="status">Selecione um circuito. Os condomínios disponíveis aparecerão abaixo.</div><div id="rota" class="rota"></div></div><div id="map"></div><div class="legend">19 condomínios · Base Operacional</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const base={nome:'Base Operacional',lat:-23.5115,lng:-46.4875,endereco:'Rua Evaristo Emiliano Bueno, 22 - Ponte Rasa, São Paulo - SP'};const pontos=[['A - Norte',1,'Matriz',-23.4848,-46.7002],['A - Norte',2,'Alameda Freguesia',-23.482,-46.6495],['A - Norte',3,'Barra do Jacaré',-23.5182,-46.5398],['A - Norte',4,'Edifício Casablanca',-23.5003,-46.6347],['A - Norte',5,'Santana At Work',-23.501,-46.634],['B - Leste',1,'Clárico Lispector',-23.4315,-46.5102],['B - Leste',2,'Vita São Miguel',-23.4801,-46.4498],['B - Leste',3,'Mirassol',-23.5502,-46.4795],['B - Leste',4,'Florence',-23.5408,-46.4697],['B - Leste',5,'Comendador José de Lucia',-23.5235,-46.505],['B - Leste',6,'Quatro Estações',-23.5207,-46.4951],['B - Leste',7,'Solar das Hortências',-23.5201,-46.4905],['C - Sul',1,'Saint Moritz',-23.5572,-46.6487],['C - Sul',2,'Angélica',-23.5453,-46.6648],['C - Sul',3,'Boulevard',-23.5305,-46.7045],['C - Sul',4,'Elevê',-23.5301,-46.6998],['C - Sul',5,'Apolo',-23.598,-46.6329],['C - Sul',6,'Spot Alto da Boa Vista',-23.6165,-46.6997],['C - Sul',7,'Green Office',-23.6103,-46.7205]];const map=L.map('map').setView([-23.54,-46.59],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);L.marker([base.lat,base.lng]).addTo(map).bindPopup('<b>Base Operacional</b><br>'+base.endereco);let markers=[];function render(){markers.forEach(m=>map.removeLayer(m));markers=[];const c=document.getElementById('circuito').value,pts=c==='TODOS'?pontos:pontos.filter(p=>p[0]===c);pts.forEach(p=>{let m=L.marker([p[3],p[4]]).addTo(map).bindPopup('<b>'+p[2]+'</b><br>'+p[0]+'<br><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination='+p[3]+','+p[4]+'">Google Maps</a> · <a target="_blank" href="https://www.waze.com/ul?ll='+p[3]+'%2C'+p[4]+'&navigate=yes">Waze</a>');markers.push(m)});document.getElementById('rota').innerHTML=pts.map((p,i)=>`<div class="item"><b>${i+1}. ${p[2]}</b><span class="small">${p[0]}</span></div>`).join('')}document.getElementById('circuito').addEventListener('change',render);render();let line=null,lastOrder=null;async function matriz(coords){let s=coords.map(x=>x[1]+','+x[0]).join(';');let r=await fetch('https://router.project-osrm.org/table/v1/driving/'+s+'?annotations=duration,distance');if(!r.ok)throw Error();return r.json()}function fmtMin(x){let m=Math.round(x/60);return Math.floor(m/60)+'h '+(m%60)+'min'}function hora(min){let h=Math.floor(min/60)%24,m=Math.round(min%60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}async function calcular(){const c=document.getElementById('circuito').value,pts=c==='TODOS'?pontos:pontos.filter(p=>p[0]===c),status=document.getElementById('status'),rota=document.getElementById('rota');status.textContent='Calculando pela distância real das ruas...';try{const all=[[base.lng,base.lat],...pts.map(p=>[p[4],p[3]])],t=await matriz(all);let rest=pts.map((p,i)=>i+1),cur=0,ord=[],totalD=0,totalT=0;while(rest.length){let best=rest[0];for(const j of rest)if(t.distances[cur][j]<t.distances[cur][best])best=j;ord.push(best);totalD+=t.distances[cur][best];totalT+=t.durations[cur][best];cur=best;rest=rest.filter(x=>x!==best)}totalD+=t.distances[cur][0];totalT+=t.durations[cur][0];lastOrder=ord.map(i=>pts[i-1]);let tempo=19*60,coords=[[base.lat,base.lng]],html='';ord.forEach((idx,k)=>{const p=pts[idx-1],prev=k===0?0:ord[k-1],d=t.distances[prev][idx],tt=t.durations[prev][idx];tempo+=tt/60;let chegada=tempo;tempo+=20;coords.push([p[3],p[4]]);html+=`<div class="item"><b>${k+1}. ${p[2]}</b><span class="small">Chegada ${hora(chegada)} · saída ${hora(tempo)} · ${(d/1000).toFixed(1)} km · ${fmtMin(tt)}</span></div>`});tempo+=t.durations[cur][0]/60;coords.push([base.lat,base.lng]);let ok=tempo<=29*60;status.innerHTML=(ok?'✅ ESTA ROTA CABE NA SUA JORNADA':'⚠️ ESTA ROTA ULTRAPASSA O HORÁRIO')+' — '+ord.length+' inspeções · '+(totalD/1000).toFixed(1)+' km · retorno '+hora(tempo);status.className='status '+(ok?'ok':'warn');rota.innerHTML=html;if(line)map.removeLayer(line);line=L.polyline(coords,{weight:5}).addTo(map);map.fitBounds(line.getBounds(),{padding:[25,25]})}catch(e){status.textContent='⚠️ Não foi possível calcular a rota. Verifique a conexão e tente novamente.';status.className='status warn'}}function montarRota(){if(!lastOrder||!lastOrder.length){alert('Primeiro clique em Calcular melhor sequência.');return}const origin=base.lat+','+base.lng,dest=lastOrder[lastOrder.length-1][3]+','+lastOrder[lastOrder.length-1][4],wps=lastOrder.slice(0,-1).map(p=>p[3]+','+p[4]).join('|');window.open('https://www.google.com/maps/dir/?api=1&origin='+origin+'&destination='+dest+'&waypoints='+encodeURIComponent(wps)+'&travelmode=driving','_blank')}</script></body></html>

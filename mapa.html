<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mapa Operacional - Sistema Khalid</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:Arial;background:#f4f6f8;color:#1f2937}header{background:#111827;color:white;padding:16px}header h1{margin:0 0 5px;font-size:22px}.toolbar{padding:12px;background:white;display:flex;gap:8px;flex-wrap:wrap;box-shadow:0 2px 6px #0002}.toolbar button{border:0;padding:10px 14px;border-radius:7px;background:#2563eb;color:white;cursor:pointer}.toolbar button.active{background:#111827}.toolbar button.base{background:#475569}#map{height:calc(100vh - 142px);min-height:520px}.legend{position:absolute;z-index:1000;bottom:25px;right:12px;background:white;padding:12px;border-radius:8px;box-shadow:0 2px 8px #0003;font-size:13px}.legend div{margin:5px 0}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}.a{background:#2563eb}.b{background:#16a34a}.c{background:#dc2626}.baseDot{background:#111827}</style></head><body><header><h1>🗺️ Mapa Operacional — Sistema Khalid</h1><div>Condomínios, circuitos e base operacional</div></header><div class="toolbar"><button class="active" onclick="filtrar('TODOS',this)">Todos</button><button onclick="filtrar('A - Norte',this)">A — Norte</button><button onclick="filtrar('B - Leste',this)">B — Leste</button><button onclick="filtrar('C - Sul',this)">C — Sul</button><button class="base" onclick="map.setView([-23.5115,-46.4875],13)">📍 Base</button></div><div id="map"></div><div class="legend"><div><span class="dot a"></span>A — Norte</div><div><span class="dot b"></span>B — Leste</div><div><span class="dot c"></span>C — Sul</div><div><span class="dot baseDot"></span>Base operacional</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const base={nome:'Base Operacional',endereco:'Rua Evaristo Emiliano Bueno, 22 - Ponte Rasa, São Paulo - SP',lat:-23.5115,lng:-46.4875};const pontos=[['A - Norte',1,'Swiss Garden','Av. Parada Pinto, 3566 - Vila Nova Cachoeirinha, SP',-23.4694,-46.6607],['A - Norte',2,'Matriz','Rua da Bica, 290 - Freguesia do Ó, SP',-23.4848,-46.7002],['A - Norte',3,'Alameda Freguesia','Rua Cel. Euclides Machado, 185 - Jardim das Graças, SP',-23.482,-46.6495],['A - Norte',4,'Barra do Jacaré','Rua Barra do Jacaré (s/n) - Vila Zat, SP',-23.5182,-46.5398],['A - Norte',5,'Edifício Casablanca','Av. Braz Leme, 2001 - Santana, SP',-23.5003,-46.6347],['A - Norte',6,'Santana At Work','Rua Voluntários da Pátria, 4370 - Santana, SP',-23.501,-46.634],['B - Leste',1,'Clárico Lispector','Clárico Lispector, 454 - Jardim Munira, Guarulhos - SP',-23.4315,-46.5102],['B - Leste',2,'Vita São Miguel','Rua João Felisberto Moreira, 174 - São Miguel Paulista, SP',-23.4801,-46.4498],['B - Leste',3,'Mirassol','Rua Coração de Maçã, 399 - Conj. Hab. Castro Alves, SP',-23.5502,-46.4795],['B - Leste',4,'Florence','Rua Chuva de Verão, 79 - Conj. Hab. Carmo, SP',-23.5408,-46.4697],['B - Leste',5,'Comendador José de Lucia','Rua Cap. João Cesário, 127 - Penha, SP',-23.5235,-46.505],['B - Leste',6,'Ravenna Penha','Rua Atuai, 131 - Penha, SP',-23.523,-46.5102],['B - Leste',7,'Quatro Estações','Av. Ajarani, 491 - Cidade Patriarca, SP',-23.5207,-46.4951],['B - Leste',8,'Solar das Hortências','Rua João Marchiori, 371 - Cidade Patriarca, SP',-23.5201,-46.4905],['C - Sul',1,'Saint Moritz','Rua Barata Ribeiro, 54 - Bela Vista, SP',-23.5572,-46.6487],['C - Sul',2,'Angélica','Av. Angélica, 1968 - Higienópolis, SP',-23.5453,-46.6648],['C - Sul',3,'Boulevard','Rua Camilo, 182 - Vila Romana, SP',-23.5305,-46.7045],['C - Sul',4,'Elevê','Rua Caio Graco, 800 - Vila Romana, SP',-23.5301,-46.6998],['C - Sul',5,'Apolo','Av. Dr. Nogueira de Martins, 264 - Saúde, SP',-23.598,-46.6329],['C - Sul',6,'Spot Alto da Boa Vista','Rua Dr. Antonio Bento, 345 - Santo Amaro, SP',-23.6165,-46.6997],['C - Sul',7,'Green Office','Rua Jandiatuba, 143 - Vila Andrade, SP',-23.6103,-46.7205]];const map=L.map('map').setView([-23.54,-46.59],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);const grupos={};function cor(c){return c==='A - Norte'?'#2563eb':c==='B - Leste'?'#16a34a':'#dc2626'}function marcador(p){const[c,o,n,e,lat,lng]=p;const m=L.circleMarker([lat,lng],{radius:8,color:cor(c),fillColor:cor(c),fillOpacity:.85,weight:2});m.bindPopup('<strong>'+o+'. '+n+'</strong><br>'+e+'<br><br><b>'+c+'</b><br><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng+'">📍 Google Maps</a> · <a target="_blank" href="https://www.waze.com/ul?ll='+lat+'%2C'+lng+'&navigate=yes">🧭 Waze</a>');m.circuito=c;return m}pontos.forEach(p=>{const m=marcador(p);(grupos[p[0]]??=[]).push(m);m.addTo(map)});const bm=L.circleMarker([base.lat,base.lng],{radius:10,color:'#111827',fillColor:'#111827',fillOpacity:1}).addTo(map);bm.bindPopup('<strong>📍 Base Operacional</strong><br>'+base.endereco);function filtrar(c,btn){document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');pontos.forEach(p=>{const ms=grupos[p[0]]||[];ms.forEach(m=>{if(c==='TODOS'||m.circuito===c)m.addTo(map);else map.removeLayer(m)})});if(c==='TODOS')map.setView([-23.54,-46.59],11);else{const bounds=[];(grupos[c]||[]).forEach(m=>bounds.push(m.getLatLng()));bounds.push(bm.getLatLng());if(bounds.length)map.fitBounds(L.latLngBounds(bounds),{padding:[30,30]})}}</script></body></html>

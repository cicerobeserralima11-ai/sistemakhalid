<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa Operacional - Sistema Khalid</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:Arial;background:#f4f6f8;color:#222}header{background:#222;color:#fff;padding:14px 16px}.bar,.panel{background:#fff;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 2px 6px #0002}.bar select,.bar button{border:1px solid #999;padding:10px 12px;border-radius:7px;background:#eee;cursor:pointer}.panel{display:block}.status{font-weight:bold;margin-bottom:8px}.rota{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{padding:10px;background:#f5f5f5;border:1px solid #ddd;border-radius:8px}.item b{display:block}.small{font-size:12px;color:#666}.zone{font-weight:bold}#map{height:calc(100vh - 285px);min-height:430px}.legend{position:absolute;z-index:1000;bottom:20px;right:10px;background:#fff;padding:10px;border-radius:8px;box-shadow:0 2px 8px #0003}@media(max-width:800px){.rota{grid-template-columns:1fr}#map{height:55vh}}</style></head><body><header><h2 style="margin:0">🗺️ Mapa Operacional — Sistema Khalid</h2><div>22 condomínios cadastrados · zonas geográficas corrigidas</div></header><div class="bar"><select id="circuito"><option value="A - Norte">A — Norte</option><option value="B - Leste">B — Leste</option><option value="C - Sul">C — Sul</option><option value="TODOS">Todos os 22</option></select><button onclick="calcular()">🚀 Calcular melhor sequência</button><button onclick="montarRota()">🗺️ Montar Rota</button><button onclick="map.setView([base.lat,base.lng],13)">📍 Base</button><span class="small">19:00 → 05:00 · 20 min/inspeção</span></div><div class="panel"><div id="status">Carregando condomínios...</div><div id="rota" class="rota"></div></div><div id="map"></div><div class="legend">22 condomínios · Base Operacional</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const base={nome:'Base Operacional',lat:-23.5115,lng:-46.4875,endereco:'Rua Evaristo Emiliano Bueno, 22 - Ponte Rasa, São Paulo - SP'};const pontos=[['A - Norte',1,'Swiss Garden','Av. Parada Pinto, 3566 - Vila Nova Cachoeirinha, SP',-23.4694,-46.6607],['A - Norte',2,'Matriz','Rua da Bica, 290 - Freguesia do Ó, SP',-23.4848,-46.7002],['A - Norte',3,'Alameda Freguesia','Rua Cel. Euclides Machado, 185 - Jardim das Graças, SP',-23.482,-46.6495],['A - Norte',4,'Barra do Jacaré','Rua Barra do Jacaré (s/n) - Vila Zat, SP',-23.5182,-46.5398],['A - Norte',5,'Edifício Casablanca','Av. Braz Leme, 2001 - Santana, SP',-23.5003,-46.6347],['A - Norte',6,'Santana At Work','Rua Voluntários da Pátria, 4370 - Santana, SP',-23.501,-46.634],['B - Leste',1,'Clárico Lispector','Clárico Lispector, 454 - Jardim Munira, Guarulhos - SP',-23.4315,-46.5102],['B - Leste',2,'Vita São Miguel','Rua João Felisberto Moreira, 174 - São Miguel Paulista, SP',-23.4801,-46.4498],['B - Leste',3,'Mirassol','Rua Coração de Maçã, 399 - Conj. Hab. Castro Alves, SP',-23.5502,-46.4795],['B - Leste',4,'Florence','Rua Chuva de Verão, 79 - Conj. Hab. Carmo, SP',-23.5408,-46.4697],['B - Leste',5,'Comendador José de Lucia','Rua Cap. João Cesário, 127 - Penha, SP',-23.5235,-46.505],['B - Leste',6,'Ravenna Penha','Rua Atuai, 131 - Penha, SP',-23.523,-46.5102],['B - Leste',7,'Quatro Estações','Av. Ajarani, 491 - Cidade Patriarca, SP',-23.5207,-46.4951],['B - Leste',8,'Solar das Hortências','Rua João Marchiori, 371 - Cidade Patriarca, SP',-23.5201,-46.4905],['B - Leste',9,'Condomínio Gibraltar','Rua Tânia Maria, 109 - Jardim Jaú, São Paulo - SP',-23.5147,-46.4809],['C - Sul',1,'Saint Moritz','Rua Barata Ribeiro, 54 - Bela Vista, SP',-23.5572,-46.6487],['C - Sul',2,'Angélica','Av. Angélica, 1968 - Higienópolis, SP',-23.5453,-46.6648],['C - Sul',3,'Boulevard','Rua Camilo, 182 - Vila Romana, SP',-23.5305,-46.7045],['C - Sul',4,'Elevê','Rua Caio Graco, 800 - Vila Romana, SP',-23.5301,-46.6998],['C - Sul',5,'Apolo','Av. Dr. Nogueira de Martins, 264 - Saúde, SP',-23.598,-46.6329],['C - Sul',6,'Spot Alto da Boa Vista','Rua Dr. Antonio Bento, 345 - Santo Amaro, SP',-23.6165,-46.6997],['C - Sul',7,'Green Office','Rua Jandiatuba, 143 - Vila Andrade, SP',-23.6103,-46.7205]];const zonas={'Swiss Garden':'Norte','Matriz':'Norte','Alameda Freguesia':'Norte','Barra do Jacaré':'Norte','Edifício Casablanca':'Norte','Santana At Work':'Norte','Clárico Lispector':'Leste','Vita São Miguel':'Leste','Mirassol':'Leste','Florence':'Leste','Comendador José de Lucia':'Leste','Ravenna Penha':'Leste','Quatro Estações':'Leste','Solar das Hortências':'Leste','Condomínio Gibraltar':'Leste','Saint Moritz':'Sul','Apolo':'Sul','Green Office':'Sul','Spot Alto da Boa Vista':'Sul','Angélica':'Centro','Boulevard':'Oeste','Elevê':'Oeste'};const map=L.map('map').setView([-23.54,-46.59],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);L.marker([base.lat,base.lng]).addTo(map).bindPopup('<b>Base Operacional</b><br>'+base.endereco);let markers=[],line=null,lastOrder=null;function render(){markers.forEach(m=>map.removeLayer(m));markers=[];const c=document.getElementById('circuito').value,pts=c==='TODOS'?pontos:pontos.filter(p=>p[0]===c);pts.forEach(p=>{const z=zonas[p[2]]||p[0].replace('A - ','').replace('B - ','').replace('C - ','');let m=L.marker([p[4],p[5]]).addTo(map).bindPopup('<b>'+p[2]+'</b><br>Zona: <b>'+z+'</b><br>Circuito: '+p[0]+'<br>Ordem: '+p[1]+'<br>'+p[3]+'<br><br><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination='+p[4]+','+p[5]+'">Google Maps</a> · <a target="_blank" href="https://www.waze.com/ul?ll='+p[4]+'%2C'+p[5]+'&navigate=yes">Waze</a>');markers.push(m)});document.getElementById('rota').innerHTML=pts.map((p,i)=>`<div class="item"><b>${i+1}. ${p[2]}</b><span class="small"><span class="zone">Zona ${zonas[p[2]]||'—'}</span> · ${p[0]} · ordem ${p[1]}</span></div>`).join('');document.getElementById('status').textContent=pts.length+' condomínio(s) carregado(s).'}document.getElementById('circuito').addEventListener('change',render);render();async function matriz(coords){let s=coords.map(x=>x[1]+','+x[0]).join(';');let r=await fetch('https://router.project-osrm.org/table/v1/driving/'+s+'?annotations=duration,distance');if(!r.ok)throw Error();return r.json()}function fmtMin(x){let m=Math.round(x/60);return Math.floor(m/60)+'h '+(m%60)+'min'}function hora(min){let h=Math.floor(min/60)%24,m=Math.round(min%60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}async function calcular(){const c=document.getElementById('circuito').value,pts=c==='TODOS'?pontos:pontos.filter(p=>p[0]===c),status=document.getElementById('status'),rota=document.getElementById('rota');status.textContent='Calculando pela distância real das ruas...';try{const all=[[base.lng,base.lat],...pts.map(p=>[p[5],p[4]])],t=await matriz(all);let rest=pts.map((p,i)=>i+1),cur=0,ord=[],totalD=0;while(rest.length){let best=rest[0];for(const j of rest)if(t.distances[cur][j]<t.distances[cur][best])best=j;ord.push(best);totalD+=t.distances[cur][best];cur=best;rest=rest.filter(x=>x!==best)}totalD+=t.distances[cur][0];lastOrder=ord.map(i=>pts[i-1]);let tempo=19*60,coords=[[base.lat,base.lng]],html='';ord.forEach((idx,k)=>{const p=pts[idx-1],prev=k===0?0:ord[k-1],d=t.distances[prev][idx],tt=t.durations[prev][idx];tempo+=tt/60;let chegada=tempo;tempo+=20;coords.push([p[4],p[5]]);html+=`<div class="item"><b>${k+1}. ${p[2]}</b><span class="small">Zona ${zonas[p[2]]||'—'} · chegada ${hora(chegada)} · saída ${hora(tempo)} · ${(d/1000).toFixed(1)} km · ${fmtMin(tt)}</span></div>`});tempo+=t.durations[cur][0]/60;coords.push([base.lat,base.lng]);status.innerHTML=(tempo<=29*60?'✅ ESTA ROTA CABE NA SUA JORNADA':'⚠️ ESTA ROTA ULTRAPASSA O HORÁRIO')+' — '+ord.length+' inspeções · '+(totalD/1000).toFixed(1)+' km · retorno '+hora(tempo);rota.innerHTML=html;if(line)map.removeLayer(line);line=L.polyline(coords,{weight:5}).addTo(map);map.fitBounds(line.getBounds(),{padding:[25,25]})}catch(e){status.textContent='⚠️ Não foi possível calcular a rota. Verifique a conexão e tente novamente.'}}function montarRota(){if(!lastOrder?.length){alert('Primeiro clique em Calcular melhor sequência.');return}const origin=base.lat+','+base.lng,dest=lastOrder.at(-1)[4]+','+lastOrder.at(-1)[5],wps=lastOrder.slice(0,-1).map(p=>p[4]+','+p[5]).join('|');window.open('https://www.google.com/maps/dir/?api=1&origin='+origin+'&destination='+dest+'&waypoints='+encodeURIComponent(wps)+'&travelmode=driving','_blank')}</script><script src="khalid-cloud.js"></script></body></html>

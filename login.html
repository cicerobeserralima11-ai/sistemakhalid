<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Sistema Khalid</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f4f4;color:#222;font-family:Arial,sans-serif;display:grid;place-items:center}.box{width:min(430px,92vw);background:#fff;border:1px solid #ccc;border-radius:14px;padding:30px;box-shadow:0 5px 20px #0002;text-align:center}.logo{width:78px;height:78px;margin:auto;border-radius:22px;background:#222;color:#fff;display:grid;place-items:center;font-size:42px;font-weight:900}.box h1{margin:16px 0 4px}.sub{color:#666;margin-bottom:24px}.field{text-align:left;margin:14px 0}label{font-weight:bold;font-size:14px}input{width:100%;padding:13px;margin-top:6px;border:1px solid #bbb;border-radius:8px;font-size:16px}.btn{width:100%;padding:13px;border:1px solid #555;border-radius:8px;background:#222;color:#fff;font-weight:bold;font-size:16px;cursor:pointer;margin-top:8px}.btn.secondary{background:#eee;color:#222}.btn:hover{opacity:.9}.msg{min-height:22px;margin-top:14px;color:#b00020;font-size:14px}.ok{color:#146c2e}.hint{font-size:12px;color:#777;margin-top:18px}.show{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:13px;color:#555}.show input{width:auto;margin:0}.forgot{display:block;margin-top:14px;font-size:13px;color:#555;cursor:pointer;text-decoration:underline}</style></head><body><main class="box"><div class="logo">K</div><h1>SISTEMA KHALID</h1><div class="sub">SUPERVISOR OPERACIONAL</div><form onsubmit="entrar(event)"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" required value="khalidbeserra@gmail.com"></div><div class="field"><label>Senha</label><input id="senha" type="password" autocomplete="current-password" required placeholder="Digite sua senha"><label class="show"><input type="checkbox" onchange="document.getElementById('senha').type=this.checked?'text':'password'"> Mostrar senha</label></div><button class="btn" type="submit">ENTRAR</button></form><button class="btn secondary" onclick="criarConta()">CRIAR MEU ACESSO</button><span class="forgot" onclick="recuperar()">Esqueci minha senha</span><div id="msg" class="msg"></div><div class="hint">Acesso protegido por Supabase Auth • KHALID</div></main><script src="auth.js"></script><script>const emailPadrao='khalidbeserra@gmail.com';document.getElementById('email').value=emailPadrao;async function entrar(e){e.preventDefault();msg('Entrando...');try{await KhalidAuth.login(document.getElementById('email').value.trim(),document.getElementById('senha').value);location.href='index.html'}catch(e){msg(e.message||'E-mail ou senha inválidos.')}}async function criarConta(){const email=document.getElementById('email').value.trim(),senha=document.getElementById('senha').value;if(!email||!senha){msg('Informe e-mail e senha para criar o acesso.');return}if(senha.length<6){msg('A senha deve ter pelo menos 6 caracteres.');return}msg('Criando acesso...');try{const x=await KhalidAuth.signup(email,senha);if(x?.access_token){msg('Acesso criado. Entrando...','ok');location.href='index.html'}else msg('Acesso criado. Se o Supabase pedir confirmação, confirme o e-mail e depois entre.','ok')}catch(e){msg(e.message||'Não foi possível criar o acesso.')}}async function recuperar(){const email=document.getElementById('email').value.trim();if(!email){msg('Informe o e-mail primeiro.');return}try{await fetch('https://kwuxixucspzqfhzxkimc.supabase.co/auth/v1/recover',{method:'POST',headers:{apikey:'sb_publishable_vsenwbLiBHSyiZrqDvhtyQ_fgiABbrh','Content-Type':'application/json'},body:JSON.stringify({email})});msg('Se o e-mail estiver cadastrado, o link de recuperação será enviado.','ok')}catch(e){msg('Não foi possível solicitar a recuperação agora.')}}function msg(t,c){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+(c||'')}</script><script src="khalid-cloud.js"></script></body></html>

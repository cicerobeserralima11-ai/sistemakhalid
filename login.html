<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Sistema Khalid</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f4f4;color:#222;font-family:Arial,sans-serif;display:grid;place-items:center}.box{width:min(420px,92vw);background:#fff;border:1px solid #ccc;border-radius:14px;padding:30px;box-shadow:0 5px 20px #0002;text-align:center}.logo{width:78px;height:78px;margin:auto;border-radius:22px;background:#333;color:#fff;display:grid;place-items:center;font-size:42px;font-weight:900}.box h1{margin:16px 0 4px}.sub{color:#666;margin-bottom:24px}.field{text-align:left;margin:14px 0}label{font-weight:bold;font-size:14px}input{width:100%;padding:13px;margin-top:6px;border:1px solid #bbb;border-radius:8px;font-size:16px}.btn{width:100%;padding:13px;border:1px solid #555;border-radius:8px;background:#333;color:#fff;font-weight:bold;font-size:16px;cursor:pointer;margin-top:8px}.btn:hover{background:#222}.msg{min-height:22px;margin-top:14px;color:#b00020;font-size:14px}.hint{font-size:12px;color:#777;margin-top:18px}.show{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:13px;color:#555}.show input{width:auto;margin:0}</style></head><body><main class="box"><div class="logo">K</div><h1>SISTEMA KHALID</h1><div class="sub">SUPERVISOR OPERACIONAL</div><form onsubmit="entrar(event)"><div class="field"><label>Usuário</label><input id="usuario" autocomplete="username" required placeholder="Digite seu usuário"></div><div class="field"><label>Senha</label><input id="senha" type="password" autocomplete="current-password" required placeholder="Digite sua senha"><label class="show"><input type="checkbox" onchange="senha.type=this.checked?'text':'password'"> Mostrar senha</label></div><button class="btn" type="submit">ENTRAR</button></form><div id="msg" class="msg"></div><div class="hint">Acesso local do Sistema Khalid</div></main><script>const usuarios=[{usuario:'khalid',senha:'123456',nome:'Khalid',perfil:'Administrador'}];function entrar(e){e.preventDefault();let u=usuario.value.trim(),s=senha.value,x=usuarios.find(a=>a.usuario===u&&a.senha===s);if(!x){msg.textContent='Usuário ou senha inválidos.';return}sessionStorage.setItem('sistemaKhalidLogin',JSON.stringify({usuario:x.usuario,nome:x.nome,perfil:x.perfil,entrada:new Date().toISOString()}));location.href='index.html'}</script></body></html>

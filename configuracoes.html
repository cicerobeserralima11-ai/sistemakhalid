<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações - Sistema Khalid</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#222;font-family:Arial,sans-serif}header{background:#222;color:#fff;padding:20px}.container{max-width:1050px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ccc;border-radius:11px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.full{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{padding:11px;border:1px solid #bbb;border-radius:7px;font-size:15px}.btn{display:inline-flex;padding:10px 14px;border:1px solid #999;border-radius:7px;background:#eee;color:#222;font-weight:bold;text-decoration:none;cursor:pointer;margin:4px}.msg{padding:11px;background:#eee;border:1px solid #ccc;border-radius:7px;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><div class="container"><h1>⚙ Configurações</h1><div>Sistema Khalid — Ajustes do sistema</div></div></header><main class="container"><div class="card"><h2>Configuração geral</h2><p>Defina as informações e padrões utilizados pelo sistema operacional.</p><div class="grid"><div class="field"><label>Nome do sistema</label><input id="nome" value="Sistema Khalid"></div><div class="field"><label>Nome do supervisor</label><input id="supervisor" value="Khalid"></div><div class="field"><label>Horário padrão de início das rotas</label><input id="inicio" type="time" value="19:00"></div><div class="field"><label>Horário limite de retorno à base</label><input id="retorno" type="time" value="05:00"></div><div class="field"><label>Tempo padrão por inspeção (minutos)</label><input id="tempo" type="number" min="1" value="20"></div><div class="field"><label>Base operacional</label><input id="base" value="Rua Evaristo Emiliano Bueno, 22 - Ponte Rasa, São Paulo - SP"></div></div><div style="margin-top:15px"><button class="btn" onclick="salvar()">💾 Salvar configurações</button><a class="btn" href="usuarios.html">♟ Gerenciar usuários</a><a class="btn" href="index.html">🏠 Voltar</a></div><div id="msg"></div></div><div class="card"><h2>Dados e manutenção</h2><p>Ferramentas para manutenção local do sistema neste dispositivo.</p><button class="btn" onclick="backup()">⬇ Exportar configurações</button><button class="btn" onclick="restaurarPadrao()">↺ Restaurar padrões</button></div></main><footer style="text-align:center;padding:20px;color:#666">Sistema Khalid © 2026</footer><script>const K='sistemaKhalidConfig';const ids=['nome','supervisor','inicio','retorno','tempo','base'];function carregar(){let x={};try{x=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}ids.forEach(id=>{if(x[id]!=null)document.getElementById(id).value=x[id]})}function salvar(){let x={};ids.forEach(id=>x[id]=document.getElementById(id).value);localStorage.setItem(K,JSON.stringify(x));document.getElementById('msg').textContent='✅ Configurações salvas com sucesso.'}function backup(){let x=localStorage.getItem(K)||'{}',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'application/json'}));a.download='configuracoes-sistema-khalid.json';a.click();URL.revokeObjectURL(a.href)}function restaurarPadrao(){if(!confirm('Restaurar as configurações padrão?'))return;localStorage.removeItem(K);location.reload()}carregar();</script><script src="khalid-cloud.js"></script></body></html>

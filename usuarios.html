<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários - Sistema Khalid</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#222;font-family:Arial,sans-serif}header{background:#222;color:#fff;padding:20px}.container{max-width:1050px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ccc;border-radius:11px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.full{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{padding:11px;border:1px solid #bbb;border-radius:7px;font-size:15px}.btn{display:inline-flex;padding:10px 14px;border:1px solid #999;border-radius:7px;background:#eee;color:#222;font-weight:bold;text-decoration:none;cursor:pointer;margin:4px}.danger{background:#e5e5e5}.table{width:100%;border-collapse:collapse;margin-top:12px}.table th,.table td{padding:11px;border-bottom:1px solid #ddd;text-align:left}.small{color:#666;font-size:13px}.msg{padding:11px;background:#eee;border:1px solid #ccc;border-radius:7px;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.table{font-size:13px}}</style></head><body><header><div class="container"><h1>♟ Usuários</h1><div>Sistema Khalid — Gestão de usuários</div></div></header><main class="container"><div class="card"><h2>Novo usuário</h2><p class="small">Cadastre quem terá acesso operacional ao sistema neste dispositivo.</p><div class="grid"><div class="field"><label>Nome *</label><input id="nome" placeholder="Nome completo"></div><div class="field"><label>Usuário *</label><input id="usuario" placeholder="Ex.: operador01"></div><div class="field"><label>Perfil</label><select id="perfil"><option>Administrador</option><option>Supervisor</option><option>Inspetor</option><option>Operador</option></select></div><div class="field"><label>Status</label><select id="status"><option>Ativo</option><option>Inativo</option></select></div></div><div style="margin-top:15px"><button class="btn" onclick="salvar()">💾 Cadastrar usuário</button><a class="btn" href="configuracoes.html">⚙ Configurações</a><a class="btn" href="index.html">🏠 Voltar</a></div><div id="msg"></div></div><div class="card"><h2>Usuários cadastrados</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Status</th><th>Ação</th></tr></thead><tbody id="lista"></tbody></table></div></div></main><footer style="text-align:center;padding:20px;color:#666">Sistema Khalid © 2026</footer><script>const K='sistemaKhalidUsuarios';function dados(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return []}}function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[c]||c))}function salvar(){let nome=document.getElementById('nome').value.trim(),usuario=document.getElementById('usuario').value.trim();if(!nome||!usuario){alert('Informe nome e usuário.');return}let a=dados();if(a.some(x=>x.usuario.toLowerCase()===usuario.toLowerCase())){alert('Este usuário já está cadastrado.');return}a.push({id:Date.now(),nome,usuario,perfil:document.getElementById('perfil').value,status:document.getElementById('status').value});localStorage.setItem(K,JSON.stringify(a));limpar();render();document.getElementById('msg').textContent='✅ Usuário cadastrado com sucesso.'}function limpar(){['nome','usuario'].forEach(id=>document.getElementById(id).value='')}function excluir(id){if(!confirm('Excluir este usuário?'))return;localStorage.setItem(K,JSON.stringify(dados().filter(x=>x.id!==id)));render()}function render(){let a=dados(),el=document.getElementById('lista');el.innerHTML=a.length?a.map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.usuario)}</td><td>${esc(x.perfil)}</td><td>${esc(x.status)}</td><td><button class="btn danger" onclick="excluir(${x.id})">🗑 Excluir</button></td></tr>`).join(''):'<tr><td colspan="5" class="small">Nenhum usuário cadastrado.</td></tr>'}render();</script></body></html>

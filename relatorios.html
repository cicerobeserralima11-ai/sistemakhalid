<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Relatórios - Sistema Khalid</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#1f2937}header{background:#111827;color:#fff;padding:22px}.container{max-width:1150px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 8px #0001}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}.btn{border:0;padding:12px 16px;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;margin:4px}.secondary{background:#475569}.info{background:#eff6ff;padding:13px;border-radius:8px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:15px 0}.stat{background:#f8fafc;padding:15px;border-radius:9px}.stat strong{display:block;font-size:24px;margin-top:5px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}.ok{background:#dcfce7;color:#166534;padding:8px;border-radius:999px}.warn{background:#fef3c7;color:#92400e;padding:8px;border-radius:999px}.danger{background:#fee2e2;color:#991b1b;padding:8px;border-radius:999px}.small{color:#64748b;font-size:13px}.hidden{display:none}@media(max-width:800px){.grid,.stats{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.stats{grid-template-columns:1fr}.table{font-size:13px}}@media print{header,.actions,.filters{display:none}.card{box-shadow:none;border:1px solid #ddd}.container{max-width:none}.table{font-size:11px}}
</style>
</head>
<body>
<header><div class="container"><h1>🛡️ Sistema Khalid</h1><div>📊 Relatórios Operacionais</div></div></header>
<main class="container">
<div class="card filters">
<h2>📊 Gerar relatório</h2>
<div class="grid">
<div class="field"><label>Período</label><select id="periodo" onchange="aplicarPeriodo()"><option value="semanal">📅 Semanal</option><option value="quinzenal">📆 Quinzenal</option><option value="mensal">🗓️ Mensal</option><option value="personalizado">🔎 Personalizado</option></select></div>
<div class="field"><label>Data inicial</label><input id="inicio" type="date"></div>
<div class="field"><label>Data final</label><input id="fim" type="date"></div>
</div>
<div style="margin-top:12px"><button class="btn" onclick="gerar()">📊 Gerar relatório</button><button class="btn secondary" onclick="window.print()">🖨️ Imprimir / PDF</button><button class="btn secondary" onclick="exportarCSV()">⬇️ Exportar CSV</button><button class="btn secondary" onclick="location.href='index.html'">🏠 Voltar ao sistema</button></div>
</div>
<div id="relatorio" class="card">
<h2>📋 Relatório Operacional</h2>
<div id="periodoTexto" class="info">Selecione o período e clique em “Gerar relatório”.</div>
<div id="conteudo"></div>
</div>
</main>
<footer style="text-align:center;padding:25px;color:#64748b">Sistema Khalid © 2026</footer>
<script>
const KEY='sistemaKhalidInspecoes';let dadosRelatorio=[];
function getIns(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function esc(v){return String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function iso(d){return d.toISOString().slice(0,10)}
function hoje(){const d=new Date();d.setHours(12,0,0,0);return d}
function aplicarPeriodo(){const p=document.getElementById('periodo').value;if(p==='personalizado')return;const fim=hoje(),inicio=new Date(fim);if(p==='semanal')inicio.setDate(fim.getDate()-6);if(p==='quinzenal')inicio.setDate(fim.getDate()-14);if(p==='mensal'){inicio.setDate(1)}document.getElementById('inicio').value=iso(inicio);document.getElementById('fim').value=iso(fim)}
function formatData(s){if(!s)return '-';const [a,m,d]=s.split('-');return d+'/'+m+'/'+a}
function statusClass(r){return r==='Conforme'?'ok':(r==='Não conforme'||r==='Ocorrência identificada'?'danger':'warn')}
function gerar(){
 const a=document.getElementById('inicio').value,b=document.getElementById('fim').value;
 if(!a||!b){alert('Informe a data inicial e a data final.');return}
 if(a>b){alert('A data inicial não pode ser maior que a data final.');return}
 dadosRelatorio=getIns().filter(x=>x.data>=a&&x.data<=b).sort((x,y)=>(x.data+' '+x.hora).localeCompare(y.data+' '+y.hora));
 const total=dadosRelatorio.length,conforme=dadosRelatorio.filter(x=>x.resultado==='Conforme').length,orient=dadosRelatorio.filter(x=>x.resultado==='Conforme com orientação').length,nao=dadosRelatorio.filter(x=>x.resultado==='Não conforme').length,oc=dadosRelatorio.filter(x=>x.resultado==='Ocorrência identificada').length,condos=new Set(dadosRelatorio.map(x=>x.condominio).filter(Boolean)).size;
 document.getElementById('periodoTexto').innerHTML='<strong>Período:</strong> '+formatData(a)+' até '+formatData(b)+' &nbsp; | &nbsp; <strong>Gerado em:</strong> '+new Date().toLocaleString('pt-BR');
 document.getElementById('conteudo').innerHTML=`<div class="stats"><div class="stat">📋 Inspeções<strong>${total}</strong></div><div class="stat">🏢 Condomínios<strong>${condos}</strong></div><div class="stat">✅ Conformes<strong>${conforme}</strong></div><div class="stat">⚠️ Com orientação<strong>${orient}</strong></div><div class="stat">🚨 Não conformes/ocorrências<strong>${nao+oc}</strong></div></div>
 <div class="info"><strong>Resumo operacional:</strong> Foram registradas ${total} inspeções em ${condos} condomínio(s), sendo ${conforme} conforme(s), ${orient} com orientação, ${nao} não conforme(s) e ${oc} com ocorrência identificada.</div>
 <div style="overflow:auto"><table class="table"><thead><tr><th>Data</th><th>Hora</th><th>Condomínio</th><th>Colaborador</th><th>Tipo</th><th>Resultado</th><th>Descrição</th><th>Providências</th></tr></thead><tbody>${dadosRelatorio.length?dadosRelatorio.map(x=>`<tr><td>${esc(formatData(x.data))}</td><td>${esc(x.hora)}</td><td><strong>${esc(x.condominio)}</strong></td><td>${esc(x.colaborador)}</td><td>${esc(x.tipo)}</td><td><span class="${statusClass(x.resultado)}">${esc(x.resultado)}</span></td><td>${esc(x.descricao)}</td><td>${esc(x.providencias)}</td></tr>`).join(''):'<tr><td colspan="8" class="small">Nenhuma inspeção registrada no período selecionado.</td></tr>'}</tbody></table></div>`;
}
function exportarCSV(){if(!dadosRelatorio.length){gerar();if(!dadosRelatorio.length)return}const cols=['data','hora','condominio','colaborador','tipo','resultado','descricao','providencias','observacoes'];const csv=[cols.join(';'),...dadosRelatorio.map(x=>cols.map(c=>'"'+String(x[c]??'').replace(/"/g,'""')+'"').join(';'))].join('\n');const blob=new Blob([new Uint8Array([0xEF,0xBB,0xBF]),csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='relatorio_'+document.getElementById('periodo').value+'_'+document.getElementById('inicio').value+'_a_'+document.getElementById('fim').value+'.csv';a.click();URL.revokeObjectURL(a.href)}
aplicarPeriodo();gerar();
</script>
</body>
</html>

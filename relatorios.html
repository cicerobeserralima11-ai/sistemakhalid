<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatórios - Sistema Khalid</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#1f2937}header{background:#111827;color:#fff;padding:20px}.container{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}.btn{border:0;padding:12px 16px;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;margin:4px;font-weight:bold}.secondary{background:#475569}.green{background:#15803d}.orange{background:#c2410c}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tab{background:#e2e8f0;color:#1f2937;border:0;padding:11px 14px;border-radius:8px;cursor:pointer;font-weight:bold}.tab.active{background:#2563eb;color:#fff}.info{background:#eff6ff;padding:13px;border-radius:8px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{background:#f8fafc;padding:14px;border-radius:9px}.stat strong{display:block;font-size:24px;margin-top:5px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}.small{color:#64748b;font-size:13px}.empty{padding:18px;text-align:center;color:#64748b;background:#f8fafc;border-radius:8px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid,.stats{grid-template-columns:1fr}.btn{width:100%;margin:4px 0}.table{font-size:12px}}@media print{header,.actions,.filters,.tabs,footer{display:none!important}.card{box-shadow:none;border:1px solid #ddd}.container{max-width:none}}</style></head><body><header><div class="container"><h1>🛡️ Sistema Khalid</h1><div>📊 Relatórios Operacionais</div></div></header><main class="container"><div class="card filters"><h2>📊 Gerar relatório</h2><div class="tabs"><button class="tab active" onclick="preset('dia',this)">📅 Dia</button><button class="tab" onclick="preset('semanal',this)">📅 Semanal</button><button class="tab" onclick="preset('quinzenal',this)">📆 Quinzenal</button><button class="tab" onclick="preset('mensal',this)">🗓️ Mensal</button><button class="tab" onclick="preset('personalizado',this)">🔎 Personalizado</button></div><div class="grid"><div class="field"><label>Tipo</label><select id="periodo" onchange="preset(this.value)"><option value="dia">Dia</option><option value="semanal">Semanal</option><option value="quinzenal">Quinzenal</option><option value="mensal">Mensal</option><option value="personalizado">Personalizado</option></select></div><div class="field"><label>Data inicial</label><input id="inicio" type="date"></div><div class="field"><label>Data final</label><input id="fim" type="date"></div></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="gerar()">📊 GERAR RELATÓRIO</button><button class="btn green" onclick="imprimir()">🖨️ IMPRIMIR / SALVAR PDF</button><button class="btn orange" onclick="exportarCSV()">⬇️ EXPORTAR CSV</button><button class="btn secondary" onclick="baixarHTML()">📄 BAIXAR RELATÓRIO HTML</button><a class="btn secondary" href="index.html">🏠 VOLTAR</a></div><div id="msg" class="small"></div></div><div id="relatorio" class="card"><h2>📋 Relatório Operacional</h2><div id="periodoTexto" class="info">Selecione um período e clique em <b>GERAR RELATÓRIO</b>.</div><div id="conteudo"><div class="empty">Nenhum relatório gerado ainda.</div></div></div></main><footer style="text-align:center;padding:25px;color:#64748b">Sistema Khalid © 2026</footer><script>
const KEYI='sistemaKhalidInspecoes',KEYO='sistemaKhalidOcorrencias';let dadosRelatorio=[],ocorrenciasRelatorio=[],gerado=false;
function get(k){try{let x=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}
function hoje(){let d=new Date();d.setHours(12,0,0,0);return d}
function iso(d){return d.toISOString().slice(0,10)}
function formatData(s){if(!s)return '-';let p=String(s).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(s)}
function preset(p,btn){document.getElementById('periodo').value=p;if(btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}if(p!=='personalizado'){let f=hoje(),i=new Date(f);if(p==='semanal')i.setDate(f.getDate()-6);if(p==='quinzenal')i.setDate(f.getDate()-14);if(p==='mensal')i.setDate(1);document.getElementById('inicio').value=iso(i);document.getElementById('fim').value=iso(f)}else{if(!document.getElementById('inicio').value)document.getElementById('inicio').value=iso(hoje());if(!document.getElementById('fim').value)document.getElementById('fim').value=iso(hoje())}}
function dataRegistro(x){return String(x.data||x.dataRegistro||x.createdAt||'').slice(0,10)}
function gerar(){let a=document.getElementById('inicio').value,b=document.getElementById('fim').value;if(!a||!b){alert('Informe as datas.');return}if(a>b){alert('A data inicial não pode ser maior que a final.');return}let ins=get(KEYI),oco=get(KEYO);dadosRelatorio=ins.filter(x=>dataRegistro(x)>=a&&dataRegistro(x)<=b);ocorrenciasRelatorio=oco.filter(x=>dataRegistro(x)>=a&&dataRegistro(x)<=b);dadosRelatorio.sort((x,y)=>(dataRegistro(x)+' '+(x.hora||'')).localeCompare(dataRegistro(y)+' '+(y.hora||'')));ocorrenciasRelatorio.sort((x,y)=>(dataRegistro(x)+' '+(x.hora||'')).localeCompare(dataRegistro(y)+' '+(y.hora||'')));let conforme=dadosRelatorio.filter(x=>x.resultado==='Conforme').length,orient=dadosRelatorio.filter(x=>x.resultado==='Conforme com orientação').length,nao=dadosRelatorio.filter(x=>x.resultado==='Não conforme'||x.resultado==='Ocorrência identificada').length,condos=new Set([...dadosRelatorio,...ocorrenciasRelatorio].map(x=>x.condominio).filter(Boolean)).size,altas=ocorrenciasRelatorio.filter(x=>['Alta','Crítica'].includes(x.gravidade)).length;document.getElementById('periodoTexto').innerHTML='<b>Período:</b> '+formatData(a)+' até '+formatData(b)+' &nbsp; | &nbsp; <b>Gerado:</b> '+new Date().toLocaleString('pt-BR');document.getElementById('conteudo').innerHTML='<div class="stats"><div class="stat">📋 Inspeções<strong>'+dadosRelatorio.length+'</strong></div><div class="stat">🚨 Ocorrências<strong>'+ocorrenciasRelatorio.length+'</strong></div><div class="stat">🏢 Condomínios<strong>'+condos+'</strong></div><div class="stat">✅ Conformes<strong>'+conforme+'</strong></div><div class="stat">⚠️ Orientações<strong>'+orient+'</strong></div><div class="stat">❌ Não conformes<strong>'+nao+'</strong></div></div><div class="info"><b>Resumo:</b> '+dadosRelatorio.length+' inspeção(ões), '+ocorrenciasRelatorio.length+' ocorrência(s), '+condos+' condomínio(s). Ocorrências de alta/crítica gravidade: '+altas+'.</div>'+tabelaIns()+tabelaOco();gerado=true;document.getElementById('msg').textContent='✅ Relatório gerado com sucesso.'}
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[c]||c))}
function tabelaIns(){if(!dadosRelatorio.length)return '<h3>📋 Inspeções</h3><div class="empty">Nenhuma inspeção no período.</div>';return '<h3>📋 Inspeções realizadas</h3><div style="overflow:auto"><table class="table"><tr><th>Data</th><th>Hora</th><th>Condomínio</th><th>Colaborador</th><th>Resultado</th><th>Descrição</th><th>Providências</th></tr>'+dadosRelatorio.map(x=>'<tr><td>'+formatData(dataRegistro(x))+'</td><td>'+esc(x.hora)+'</td><td><b>'+esc(x.condominio)+'</b></td><td>'+esc(x.colaborador)+'</td><td>'+esc(x.resultado)+'</td><td>'+esc(x.descricao)+'</td><td>'+esc(x.providencias)+'</td></tr>').join('')+'</table></div>'}
function tabelaOco(){if(!ocorrenciasRelatorio.length)return '<h3>🚨 Ocorrências</h3><div class="empty">Nenhuma ocorrência no período.</div>';return '<h3>🚨 Ocorrências registradas</h3><div style="overflow:auto"><table class="table"><tr><th>Data</th><th>Hora</th><th>Condomínio</th><th>Colaborador</th><th>Tipo</th><th>Gravidade</th><th>Descrição</th><th>Providências</th></tr>'+ocorrenciasRelatorio.map(x=>'<tr><td>'+formatData(dataRegistro(x))+'</td><td>'+esc(x.hora)+'</td><td><b>'+esc(x.condominio)+'</b></td><td>'+esc(x.colaborador)+'</td><td>'+esc(x.tipo)+'</td><td>'+esc(x.gravidade)+'</td><td>'+esc(x.descricao)+'</td><td>'+esc(x.providencias)+'</td></tr>').join('')+'</table></div>'}
function imprimir(){if(!gerado)gerar();setTimeout(()=>window.print(),100)}
function exportarCSV(){if(!gerado)gerar();setTimeout(()=>{if(!dadosRelatorio.length&&!ocorrenciasRelatorio.length){alert('Não há registros no período selecionado.');return}let rows=[['TIPO','DATA','HORA','CONDOMÍNIO','COLABORADOR','TIPO/CATEGORIA','RESULTADO/GRAVIDADE','DESCRIÇÃO','PROVIDÊNCIAS','OBSERVAÇÕES']];dadosRelatorio.forEach(x=>rows.push(['Inspeção',dataRegistro(x),x.hora,x.condominio,x.colaborador,x.tipo,x.resultado,x.descricao,x.providencias,x.observacoes]));ocorrenciasRelatorio.forEach(x=>rows.push(['Ocorrência',dataRegistro(x),x.hora,x.condominio,x.colaborador,x.tipo,x.gravidade,x.descricao,x.providencias,x.observacoes]));let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download='relatorio_khalid_'+document.getElementById('inicio').value+'_'+document.getElementById('fim').value+'.csv';document.body.appendChild(el);el.click();el.remove();URL.revokeObjectURL(u)},120)}
function baixarHTML(){if(!gerado)gerar();setTimeout(()=>{let html='<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Relatório KHALID</title><style>body{font-family:Arial;margin:30px;color:#222}table{width:100%;border-collapse:collapse;margin:15px 0}th,td{border:1px solid #ccc;padding:7px;text-align:left;vertical-align:top}th{background:#eee}.info{padding:10px;background:#eef6ff}</style></head><body><h1>Sistema KHALID — Relatório Operacional</h1><div class="info">'+document.getElementById('periodoTexto').innerHTML+'</div>'+document.getElementById('conteudo').innerHTML+'</body></html>',blob=new Blob([html],{type:'text/html;charset=utf-8'}),u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download='relatorio_khalid.html';document.body.appendChild(el);el.click();el.remove();URL.revokeObjectURL(u)},120)}
preset('dia');gerar();
</script></body></html>

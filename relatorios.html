<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relatórios - Sistema Khalid</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#1f2937}header{background:#111827;color:#fff;padding:18px}.container{max-width:1200px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab,.btn{border:0;padding:12px 15px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:15px}.tab{background:#e2e8f0}.tab.active,.btn{background:#2563eb;color:#fff}.green{background:#15803d}.orange{background:#c2410c}.secondary{background:#475569}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat{background:#f8fafc;padding:12px;border-radius:8px}.stat strong{display:block;font-size:24px;margin-top:5px}.info{background:#eff6ff;padding:12px;border-radius:8px;margin:10px 0}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left}.empty{text-align:center;padding:18px;color:#64748b;background:#f8fafc;border-radius:8px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.container{padding:12px}.grid,.stats{grid-template-columns:1fr}.actions .btn{width:100%;min-height:48px}.tab{flex:1;min-width:120px}.table{font-size:12px}}
@media print{header,.filters,.actions,footer{display:none!important}.card{box-shadow:none}.container{max-width:none}}
</style></head>
<body>
<header><div class="container"><h1>🛡️ Sistema KHALID</h1><div>📊 Relatórios Operacionais</div></div></header>
<main class="container">
<div class="card filters"><h2>📊 Gerar relatório</h2>
<div class="tabs"><button class="tab active" onclick="preset('dia',this)">📅 Dia</button><button class="tab" onclick="preset('semanal',this)">📅 Semanal</button><button class="tab" onclick="preset('quinzenal',this)">📆 Quinzenal</button><button class="tab" onclick="preset('mensal',this)">🗓️ Mensal</button><button class="tab" onclick="preset('personalizado',this)">🔎 Personalizado</button></div>
<div class="grid"><div class="field"><label>Tipo</label><select id="periodo" onchange="preset(this.value)"><option value="dia">Dia</option><option value="semanal">Semanal</option><option value="quinzenal">Quinzenal</option><option value="mensal">Mensal</option><option value="personalizado">Personalizado</option></select></div><div class="field"><label>Data inicial</label><input id="inicio" type="date"></div><div class="field"><label>Data final</label><input id="fim" type="date"></div></div>
<div class="actions"><button class="btn" onclick="gerar()">📊 GERAR RELATÓRIO</button><button class="btn green" onclick="baixarPDF()">📥 BAIXAR PDF</button><button class="btn secondary" onclick="imprimir()">🖨️ IMPRIMIR / PDF</button><button class="btn orange" onclick="exportarCSV()">⬇️ CSV</button><a class="btn secondary" href="index.html">🏠 VOLTAR</a></div><div id="msg"></div></div>
<div id="relatorio" class="card"><h2>📋 Relatório Operacional</h2><div id="periodoTexto" class="info">Selecione um período.</div><div id="conteudo"><div class="empty">Nenhum relatório gerado.</div></div></div>
</main><footer style="text-align:center;padding:20px;color:#64748b">Sistema KHALID © 2026</footer>
<script src="khalid-cloud.js"></script>
<script>
const KI='sistemaKhalidInspecoes',KO='sistemaKhalidOcorrencias';let ins=[],oco=[],gerado=false;
function get(k){try{const a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function hoje(){const d=new Date();d.setHours(12,0,0,0);return d}function iso(d){return d.toISOString().slice(0,10)}function fd(s){if(!s)return '-';const p=String(s).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(s)}function dr(x){return String(x.data||x.dataRegistro||x.data_inspecao||x.data_ocorrencia||x.createdAt||'').slice(0,10)}
function preset(p,b){document.getElementById('periodo').value=p;if(b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}const f=hoje(),i=new Date(f);if(p==='semanal')i.setDate(f.getDate()-6);if(p==='quinzenal')i.setDate(f.getDate()-14);if(p==='mensal')i.setDate(1);if(p==='personalizado')return;document.getElementById('inicio').value=iso(i);document.getElementById('fim').value=iso(f)}
function gerar(){const a=document.getElementById('inicio').value,b=document.getElementById('fim').value;if(!a||!b||a>b){alert('Informe um período válido.');return}ins=get(KI).filter(x=>dr(x)>=a&&dr(x)<=b);oco=get(KO).filter(x=>dr(x)>=a&&dr(x)<=b);render(a,b)}
function render(a,b){const conf=ins.filter(x=>String(x.resultado||x.status||'').toLowerCase().trim()==='conforme').length;const ori=ins.filter(x=>String(x.resultado||x.status||'').toLowerCase().includes('orienta')).length;const nao=ins.filter(x=>{const r=String(x.resultado||x.status||'').toLowerCase();return r.includes('não conforme')||r.includes('nao conforme')||r.includes('ocorrência')}).length;const condos=new Set([...ins,...oco].map(x=>x.condominio||x.condominio_nome).filter(Boolean)).size;document.getElementById('periodoTexto').innerHTML='<b>Período:</b> '+fd(a)+' até '+fd(b)+' | <b>Gerado:</b> '+new Date().toLocaleString('pt-BR');document.getElementById('conteudo').innerHTML='<div class="stats"><div class="stat">📋 Inspeções<strong>'+ins.length+'</strong></div><div class="stat">🚨 Ocorrências<strong>'+oco.length+'</strong></div><div class="stat">🏢 Condomínios<strong>'+condos+'</strong></div><div class="stat">✅ Conformes<strong>'+conf+'</strong></div><div class="stat">⚠️ Orientações<strong>'+ori+'</strong></div><div class="stat">❌ Não conformes<strong>'+nao+'</strong></div></div>'+tIns()+tOco();gerado=true;document.getElementById('msg').textContent='✅ Relatório gerado.'}
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[c]||c))}
function tIns(){if(!ins.length)return '<h3>📋 Inspeções</h3><div class="empty">Nenhuma inspeção no período.</div>';return '<h3>📋 Inspeções</h3><div style="overflow:auto"><table class="table"><tr><th>Data</th><th>Condomínio</th><th>Colaborador</th><th>Resultado</th><th>Descrição</th></tr>'+ins.map(x=>'<tr><td>'+fd(dr(x))+'</td><td>'+esc(x.condominio||x.condominio_nome)+'</td><td>'+esc(x.colaborador||x.inspetor)+'</td><td>'+esc(x.resultado||x.status)+'</td><td>'+esc(x.descricao||x.observacoes)+'</td></tr>').join('')+'</table></div>'}
function tOco(){if(!oco.length)return '<h3>🚨 Ocorrências</h3><div class="empty">Nenhuma ocorrência no período.</div>';return '<h3>🚨 Ocorrências</h3><div style="overflow:auto"><table class="table"><tr><th>Data</th><th>Condomínio</th><th>Tipo</th><th>Gravidade</th><th>Descrição</th></tr>'+oco.map(x=>'<tr><td>'+fd(dr(x))+'</td><td>'+esc(x.condominio||x.condominio_nome)+'</td><td>'+esc(x.tipo||x.categoria)+'</td><td>'+esc(x.gravidade||x.prioridade)+'</td><td>'+esc(x.descricao||x.relato)+'</td></tr>').join('')+'</table></div>'}
function imprimir(){if(!gerado)gerar();setTimeout(()=>window.print(),100)}
function baixarPDF(){if(!gerado){gerar();setTimeout(baixarPDF,150);return}const a=document.getElementById('inicio').value,b=document.getElementById('fim').value;try{if(window.jspdf){const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'landscape'});doc.setFontSize(18);doc.text('SISTEMA KHALID — RELATÓRIO OPERACIONAL',14,16);doc.setFontSize(10);doc.text('Período: '+fd(a)+' até '+fd(b),14,24);doc.text('Inspeções: '+ins.length+' | Ocorrências: '+oco.length,14,31);let y=40;doc.setFontSize(9);for(const x of ins){if(y>195){doc.addPage();y=15}doc.text(fd(dr(x))+' | '+(x.condominio||'-')+' | '+(x.resultado||'-'),14,y);y+=5}if(y>185){doc.addPage();y=15}doc.setFontSize(11);doc.text('OCORRÊNCIAS',14,y);y+=7;doc.setFontSize(9);for(const x of oco){if(y>195){doc.addPage();y=15}doc.text(fd(dr(x))+' | '+(x.condominio||'-')+' | '+(x.tipo||'-')+' | '+(x.gravidade||'-'),14,y);y+=5}doc.save('relatorio_khalid_'+a+'_'+b+'.pdf');return}}catch(e){}alert('Para garantir o PDF no celular, será aberta a impressão do relatório. Escolha "Salvar como PDF".');imprimir()}
function exportarCSV(){if(!gerado)gerar();const rows=[['TIPO','DATA','CONDOMÍNIO','COLABORADOR','RESULTADO/GRAVIDADE','DESCRIÇÃO']];ins.forEach(x=>rows.push(['Inspeção',dr(x),x.condominio||x.condominio_nome,x.colaborador||x.inspetor,x.resultado||x.status,x.descricao||x.observacoes]));oco.forEach(x=>rows.push(['Ocorrência',dr(x),x.condominio||x.condominio_nome,x.colaborador,x.gravidade||x.prioridade,x.descricao||x.relato]));const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const e=document.createElement('a');e.href=u;e.download='relatorio_khalid.csv';document.body.appendChild(e);e.click();e.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
preset('dia');gerar();window.addEventListener('khalid-cloud-synced',()=>{if(gerado)gerar()});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js" defer></script>
</body></html>

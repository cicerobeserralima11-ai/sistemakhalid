<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatórios - Sistema Khalid</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#1f2937}header{background:#111827;color:#fff;padding:20px}.container{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}.btn{border:0;padding:12px 16px;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;margin:4px;font-weight:bold}.green{background:#15803d}.orange{background:#c2410c}.secondary{background:#475569}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{background:#e2e8f0;border:0;padding:11px 14px;border-radius:8px;cursor:pointer;font-weight:bold}.tab.active{background:#2563eb;color:#fff}.info{background:#eff6ff;padding:13px;border-radius:8px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{background:#f8fafc;padding:14px;border-radius:9px}.stat strong{display:block;font-size:24px;margin-top:5px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}.empty{padding:18px;text-align:center;color:#64748b;background:#f8fafc;border-radius:8px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid,.stats{grid-template-columns:1fr}.btn{width:100%;margin:4px 0}}@media print{header,.actions,.filters,.tabs,footer{display:none!important}.card{box-shadow:none;border:1px solid #ddd}}</style></head><body><header><div class="container"><h1>🛡️ Sistema Khalid</h1><div>📊 Relatórios Operacionais</div></div></header><main class="container"><div class="card filters"><h2>📊 Gerar relatório</h2><div class="tabs"><button class="tab active" onclick="preset('dia',this)">📅 Dia</button><button class="tab" onclick="preset('semanal',this)">📅 Semanal</button><button class="tab" onclick="preset('quinzenal',this)">📆 Quinzenal</button><button class="tab" onclick="preset('mensal',this)">🗓️ Mensal</button><button class="tab" onclick="preset('personalizado',this)">🔎 Personalizado</button></div><div class="grid"><div class="field"><label>Tipo</label><select id="periodo" onchange="preset(this.value)"><option value="dia">Dia</option><option value="semanal">Semanal</option><option value="quinzenal">Quinzenal</option><option value="mensal">Mensal</option><option value="personalizado">Personalizado</option></select></div><div class="field"><label>Data inicial</label><input id="inicio" type="date"></div><div class="field"><label>Data final</label><input id="fim" type="date"></div></div><div class="actions"><button class="btn" onclick="gerar()">📊 GERAR RELATÓRIO</button><button class="btn green" onclick="baixarPDF()">📥 BAIXAR PDF</button><button class="btn secondary" onclick="imprimir()">🖨️ IMPRIMIR</button><button class="btn orange" onclick="exportarCSV()">⬇️ EXPORTAR CSV</button><a class="btn secondary" href="index.html">🏠 VOLTAR</a></div><div id="msg"></div></div><div id="relatorio" class="card"><h2>📋 Relatório Operacional</h2><div id="periodoTexto" class="info">Selecione um período.</div><div id="conteudo"><div class="empty">Nenhum relatório gerado.</div></div></div></main><script src="khalid-cloud.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script><script>
const KI='sistemaKhalidInspecoes',KO='sistemaKhalidOcorrencias';let ins=[],oco=[],gerado=false;
function get(k){try{let a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function hoje(){let d=new Date();d.setHours(12,0,0,0);return d}function iso(d){return d.toISOString().slice(0,10)}function fd(s){if(!s)return'-';let p=String(s).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}function dr(x){return String(x.data||x.dataRegistro||x.data_inspecao||x.data_ocorrencia||x.createdAt||'').slice(0,10)}
function preset(p,b){document.getElementById('periodo').value=p;if(b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}let f=hoje(),i=new Date(f);if(p==='semanal')i.setDate(f.getDate()-6);if(p==='quinzenal')i.setDate(f.getDate()-14);if(p==='mensal')i.setDate(1);document.getElementById('inicio').value=iso(i);document.getElementById('fim').value=iso(f)}
function gerar(){if(window.KhalidCloud&&KhalidCloud.syncAll)KhalidCloud.syncAll().finally(gerarLocal);else gerarLocal()}
function gerarLocal(){let a=document.getElementById('inicio').value,b=document.getElementById('fim').value;if(!a||!b||a>b){alert('Informe um período válido.');return}ins=get(KI).filter(x=>dr(x)>=a&&dr(x)<=b);oco=get(KO).filter(x=>dr(x)>=a&&dr(x)<=b);let conf=ins.filter(x=>String(x.resultado||x.status||'').toLowerCase().trim()==='conforme').length,ori=ins.filter(x=>String(x.resultado||x.status||'').toLowerCase().includes('orienta')).length,nao=ins.filter(x=>{let r=String(x.resultado||x.status||'').toLowerCase();return r.includes('não conforme')||r.includes('nao conforme')||r.includes('ocorrência')}).length,condos=new Set([...ins,...oco].map(x=>x.condominio||x.condominio_nome).filter(Boolean)).size;document.getElementById('periodoTexto').innerHTML='<b>Período:</b> '+fd(a)+' até '+fd(b)+' | <b>Gerado:</b> '+new Date().toLocaleString('pt-BR');document.getElementById('conteudo').innerHTML='<div class="stats"><div class="stat">📋 Inspeções<strong>'+ins.length+'</strong></div><div class="stat">🚨 Ocorrências<strong>'+oco.length+'</strong></div><div class="stat">🏢 Condomínios<strong>'+condos+'</strong></div><div class="stat">✅ Conformes<strong>'+conf+'</strong></div><div class="stat">⚠️ Orientações<strong>'+ori+'</strong></div><div class="stat">❌ Não conformes<strong>'+nao+'</strong></div></div>'+tIns()+tOco();gerado=true;document.getElementById('msg').textContent='✅ Relatório atualizado com os dados sincronizados.'}
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[c]||c))}function tIns(){if(!ins.length)return'<h3>📋 Inspeções</h3><div class="empty">Nenhuma inspeção no período.</div>';return'<h3>📋 Inspeções realizadas</h3><div style="overflow:auto"><table class="table"><tr><th>Data</th><th>Hora</th><th>Condomínio</th><th>Colaborador</th><th>Resultado</th><th>Descrição</th></tr>'+ins.map(x=>'<tr><td>'+fd(dr(x))+'</td><td>'+esc(x.hora)+'</td><td>'+esc(x.condominio||x.condominio_nome)+'</td><td>'+esc(x.colaborador||x.inspetor)+'</td><td>'+esc(x.resultado||x.status)+'</td><td>'+esc(x.descricao||x.observacoes)+'</td></tr>').join('')+'</table></div>'}function tOco(){if(!oco.length)return'<h3>🚨 Ocorrências</h3><div class="empty">Nenhuma ocorrência no período.</div>';return'<h3>🚨 Ocorrências registradas</h3><div style="overflow:auto"><table class="table"><tr><th>Data</th><th>Hora</th><th>Condomínio</th><th>Tipo</th><th>Gravidade</th><th>Descrição</th></tr>'+oco.map(x=>'<tr><td>'+fd(dr(x))+'</td><td>'+esc(x.hora)+'</td><td>'+esc(x.condominio||x.condominio_nome)+'</td><td>'+esc(x.tipo||x.categoria)+'</td><td>'+esc(x.gravidade||x.prioridade)+'</td><td>'+esc(x.descricao||x.relato)+'</td></tr>').join('')+'</table></div>'}
function imprimir(){if(!gerado)gerarLocal();setTimeout(()=>window.print(),200)}
function baixarPDF(){if(!gerado){gerar();setTimeout(baixarPDF,700);return}if(!window.jspdf){alert('Biblioteca PDF ainda carregando. Tente novamente em alguns segundos.');return}const {jsPDF}=window.jspdf;let doc=new jsPDF({orientation:'landscape'}),a=document.getElementById('inicio').value,b=document.getElementById('fim').value;doc.setFontSize(18);doc.text('SISTEMA KHALID — RELATÓRIO OPERACIONAL',14,16);doc.setFontSize(10);doc.text('Período: '+fd(a)+' até '+fd(b),14,24);doc.text('Gerado em: '+new Date().toLocaleString('pt-BR'),14,30);let y=40;let conf=ins.filter(x=>String(x.resultado||x.status||'').toLowerCase().trim()==='conforme').length,ori=ins.filter(x=>String(x.resultado||x.status||'').toLowerCase().includes('orienta')).length;doc.setFontSize(12);doc.text('RESUMO',14,y);y+=8;doc.setFontSize(10);doc.text('Inspeções: '+ins.length+'   |   Conformes: '+conf+'   |   Com orientação: '+ori+'   |   Ocorrências: '+oco.length,14,y);y+=10;doc.setFontSize(11);doc.text('INSPEÇÕES',14,y);y+=7;doc.setFontSize(8);for(const x of ins){let line=fd(dr(x))+' | '+(x.condominio||x.condominio_nome||'-')+' | '+(x.resultado||x.status||'-');let lines=doc.splitTextToSize(line,260);if(y>195){doc.addPage();y=15}doc.text(lines,14,y);y+=lines.length*4.5}y+=5;if(y>195){doc.addPage();y=15}doc.setFontSize(11);doc.text('OCORRÊNCIAS',14,y);y+=7;doc.setFontSize(8);for(const x of oco){let line=fd(dr(x))+' | '+(x.condominio||x.condominio_nome||'-')+' | '+(x.tipo||x.categoria||'-')+' | '+(x.gravidade||x.prioridade||'-');let lines=doc.splitTextToSize(line,260);if(y>195){doc.addPage();y=15}doc.text(lines,14,y);y+=lines.length*4.5}doc.save('relatorio_khalid_'+a+'_'+b+'.pdf')}
function exportarCSV(){if(!gerado)gerarLocal();setTimeout(()=>{let rows=[['TIPO','DATA','HORA','CONDOMÍNIO','COLABORADOR','RESULTADO/GRAVIDADE','DESCRIÇÃO']];ins.forEach(x=>rows.push(['Inspeção',dr(x),x.hora,x.condominio||x.condominio_nome,x.colaborador||x.inspetor,x.resultado||x.status,x.descricao||x.observacoes]));oco.forEach(x=>rows.push(['Ocorrência',dr(x),x.hora,x.condominio||x.condominio_nome,x.colaborador,x.gravidade||x.prioridade,x.descricao||x.relato]));let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),e=document.createElement('a');e.href=u;e.download='relatorio_khalid.csv';e.click();URL.revokeObjectURL(u)},200)}
preset('dia');window.addEventListener('khalid-cloud-synced',()=>{if(document.getElementById('periodo'))gerarLocal()});gerar();
</script></body></html>
